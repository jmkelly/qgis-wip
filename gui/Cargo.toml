[package]
name = "qgis-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "GUI for QGIS Rust port (iced + wgpu, built last per ADR-0002)"

[dependencies]
iced = { workspace = true, features = ["canvas"] }
qgis-geometry = { path = "../geometry" }
qgis-crs = { path = "../crs" }
qgis-core = { path = "../core" }
qgis-providers = { path = "../providers" }
qgis-spatial-index = { path = "../spatial-index" }
qgis-style = { path = "../style" }
serde_json = { workspace = true }

[dev-dependencies]
# Already pinned exact in the root [workspace.dependencies] table (qgis-providers
# uses it for GeoPackage); dev-only, used by the file-open acceptance test to
# build a real .gpkg in a temp dir.
rusqlite = { workspace = true }
