name: Rust Port CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
      - uses: Swatinem/rust-cache@v2
      - name: Run workspace tests
        run: cargo test --workspace

  clippy:
    name: clippy lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Run clippy with -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

  bench-compile:
    name: bench compile check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
      - uses: Swatinem/rust-cache@v2
      - name: Verify benches compile
        run: cargo bench -p qgis-bench --no-run

  oracle:
    name: oracle smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
      - uses: Swatinem/rust-cache@v2
      - name: Run oracle on trivial fixture
        run: cargo run -p qgis-oracle -- oracle/fixtures/trivial.txt

  geiger:
    name: geiger (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-geiger
        run: cargo install cargo-geiger --locked
      - name: Run cargo-geiger
        run: |
          # cargo-geiger 0.14.0 rejects the virtual workspace manifest
          # ("manifest path ... is a virtual manifest"), so --workspace can
          # never succeed at the repo root; audit every package individually
          # instead (bead qgis-nw5). Findings are advisory: this job is
          # continue-on-error and uses the same || true convention as
          # ci.sh's informational geiger gate.
          for manifest in $(cargo metadata --no-deps --format-version 1 | jq -r '.packages[].manifest_path'); do
            cargo geiger --manifest-path "$manifest" || true
          done

  headless:
    name: headless acceptance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
      - uses: Swatinem/rust-cache@v2
      - name: Run headless acceptance scenarios
        run: ./verify headless
