# qgis-fixtures store manifest
#
# Catalog of oracle fixtures collected from the QGIS 4 source tree
# (tests/testdata/, tests/src/python/). Parsed by the qgis-fixtures crate
# (fixtures) using a constrained TOML subset: [meta] string pairs
# plus [fixture.<name>] sections with the keys below.
#
# Fixture entry keys:
#   category    - one of: qgs-project, style, expression, provider-sample
#   source      - origin path in the QGIS 4 tree, or "synthetic"
#   path        - fixture file path relative to this manifest's directory
#   sidecars    - optional array of additional files required by the fixture
#   description - what the fixture exercises
#
# All fixtures in this store are real QGIS 4 test data, except entries
# marked source = "synthetic" (authored for the agent validation suites).
# See README.md in this directory for provenance and licensing.

[meta]
name = "qgis4-oracle-fixtures"
version = "1"
description = "Golden input fixtures for the QGIS Rust port oracle, collected from the QGIS 4 test suite."

# ---------------------------------------------------------------- projects

[fixture.joins]
category = "qgs-project"
source = "tests/testdata/joins.qgs"
path = "qgs-projects/joins.qgs"
description = "Two OGR polygon layers with a layer join defined; exercises project parsing and join resolution. Layer sources reference absolute paths from the QGIS CI machine."

[fixture.relations]
category = "qgs-project"
source = "tests/testdata/relations.qgs"
path = "qgs-projects/relations.qgs"
description = "Project with inter-layer relations; exercises relation parsing from the project file."

