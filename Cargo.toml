[workspace]
resolver = "2"
members = [
    "crates/geometry",
    "crates/crs",
    "crates/expression",
    "crates/fixtures",
    "crates/oracle",
    "crates/providers",
    "crates/analysis",
    "crates/server",
    "crates/pyo3",
    "crates/gui",
    "crates/qgis-bench",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "GPL-3.0-or-later"
repository = "https://github.com/qgis/qgis-rs"
description = "Pure-Rust reimplementation of QGIS 4.x"

# Policy: ALL external (non-path, non-workspace) dependencies must be declared here
# with an exact version pin (e.g. `crate = "=X.Y.Z"`). Crates reference them via
# `dep.workspace = true`. This prevents Cargo.lock contention when parallel
# implementers add dependencies — only this file changes, never individual crates.
# Internal path dependencies (qgis-geometry, qgis-crs, etc.) stay in each crate's
# [dependencies] table as-is.
[workspace.dependencies]
iced = "=0.13.1"
pyo3 = "=0.29.3"
criterion = "=0.5.1"
