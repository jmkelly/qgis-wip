[workspace]
resolver = "2"
members = [
    "geometry",
    "core",
    "style",
    "spatial-index",
    "crs",
    "expression",
    "fixtures",
    "oracle",
    "providers",
    "analysis",

    "server",
    "pyo3",
    "gui",
    "qgis-bench",
    "raster",
    "mesh",
    "pointcloud",
    "validate",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "GPL-3.0-or-later"
repository = "https://github.com/qgis/qgis-rs"
description = "Pure-Rust reimplementation of QGIS 4.x"

# Policy: ALL external (non-path, non-workspace) dependencies must be declared here
# with an exact version pin (e.g. `crate = "=X.Y.Z"`). Crates reference them via
# `dep.workspace = true`. This prevents Cargo.lock contention when parallel
# implementers add dependencies — only this file changes, never individual crates.
# Internal path dependencies (qgis-geometry, qgis-crs, etc.) stay in each crate's
# [dependencies] table as-is.
[workspace.dependencies]
iced = "=0.13.1"
pyo3 = "=0.29.3"
criterion = "=0.5.1"
proj4rs = { version = "=0.1.4", features = ["geo-types"] }
crs-definitions = { version = "=0.6.0", features = ["proj4", "wkt"] }
axum = "=0.8.9"
tokio = { version = "=1.49.0", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "signal"] }
bytes = "=1.11.0"
thiserror = "=2.0.12"
rusqlite = "=0.32.1"
tracing = "=0.1.44"
png = "=0.17.16"
geo = "=0.28.0"
regex = "=1.13.1"
roxmltree = "=0.20.0"
serde_json = "=1.0.152"
rand = "=0.8.8"
base64 = "=0.22.1"
hmac = "=0.12.1"
sha2 = "=0.10.9"
